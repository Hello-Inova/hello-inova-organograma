<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organograma — Grupo Empresarial Hello Inova</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  :root {
    --ink: #1C1B29;
    --slate: #6B6B80;
    --line-gray: #E4E4F0;
    --bg: #F7F7FB;
    --card-bg: #FFFFFF;
    --brand: #4F46E5;
    --brand-dark: #3730A3;
    --brand-soft: #EEF0FF;
  }
  html.dark {
    --ink: #F1F0FA;
    --slate: #A6A3C2;
    --line-gray: #322E45;
    --bg: #14121F;
    --card-bg: #1E1B2E;
    --brand: #7C74F5;
    --brand-dark: #5B52E8;
    --brand-soft: #2A2540;
  }
  * { box-sizing: border-box; }
  html { transition: background-color .3s ease; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: 'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
    padding: 24px 12px 60px;
    transition: background-color .3s ease;
  }
  .chart-wrap {
    max-width: 1798px;
    margin: 0 auto;
    overflow-x: auto;
  }
  svg { width: 100%; height: auto; display: block; }
  .chart-wrap text { font-family: 'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif; }
  .chart-wrap svg rect, .chart-wrap svg text, .chart-wrap svg circle, .chart-wrap svg line {
    transition: fill .3s ease, stroke .3s ease;
  }
  .card-group {
    cursor: pointer;
    outline: none;
    transition: transform .15s ease;
  }
  .card-group:hover, .card-group:focus {
    transform: translateY(-5px);
  }
  .card-group:hover .card-rect, .card-group:focus .card-rect {
    filter: url(#cardShadowHover);
    stroke: var(--brand);
  }

  /* Theme toggle */
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--line-gray);
    background: var(--card-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(28,27,41,0.10);
    z-index: 200;
    transition: background-color .3s ease, border-color .3s ease, transform .2s ease;
  }
  .theme-toggle:hover { transform: scale(1.07); }
  .theme-toggle svg {
    width: 20px;
    height: 20px;
    position: absolute;
    transition: opacity .25s ease, transform .35s ease;
  }
  .icon-sun { color: #E8A93B; opacity: 1; transform: scale(1) rotate(0deg); }
  .icon-moon { color: #7C74F5; opacity: 0; transform: scale(0.4) rotate(-90deg); }
  html.dark .icon-sun { opacity: 0; transform: scale(0.4) rotate(90deg); }
  html.dark .icon-moon { opacity: 1; transform: scale(1) rotate(0deg); }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 9, 20, 0.6);
    backdrop-filter: blur(2px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .overlay.active { display: flex; }
  .modal {
    background: var(--card-bg);
    width: 100%;
    max-width: 640px;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 24px 70px rgba(79, 70, 229, 0.28);
    position: relative;
    border-top: 5px solid var(--brand);
    transition: background-color .3s ease;
  }
  .modal-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--brand-soft);
    color: var(--brand-dark);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    transition: background-color .3s ease, color .3s ease;
  }
  .modal-close:hover { background: var(--brand); color: #fff; }
  .modal-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .modal-mono {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: 0 0 0 3px var(--card-bg), 0 0 0 4px var(--line-gray);
    transition: box-shadow .3s ease;
  }
  .modal-title {
    font-size: 22px;
    font-weight: 800;
    color: var(--ink);
    margin: 0;
  }
  .modal-sector {
    font-size: 13px;
    color: var(--slate);
    margin: 2px 0 0;
  }
  .modal-divider {
    border: none;
    border-top: 1px solid var(--line-gray);
    margin: 20px 0;
  }
  .modal-eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--brand);
    margin: 0 0 10px;
  }
  .profile-text {
    min-height: 160px;
    border: 1.5px dashed var(--line-gray);
    border-radius: 12px;
    padding: 16px;
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink);
    white-space: pre-wrap;
  }
  .profile-text:focus {
    outline: none;
    border-color: var(--brand);
    border-style: solid;
  }
  .profile-text.empty { color: #A5A3B8; font-style: italic; }
  .modal-hint {
    font-size: 12px;
    color: var(--slate);
    margin-top: 12px;
  }
</style>
</head>

<div class="overlay" id="overlay" onclick="if(event.target===this) closeProfile()">
  <div class="modal">
    <button class="modal-close" onclick="closeProfile()" aria-label="Fechar">&times;</button>
    <div class="modal-header">
      <div class="modal-mono" id="modalMono"></div>
      <div>
        <p class="modal-title" id="modalTitle"></p>
        <p class="modal-sector" id="modalSector"></p>
      </div>
    </div>
    <hr class="modal-divider">
    <p class="modal-eyebrow">PERFIL DA EMPRESA</p>
    <div class="profile-text" id="modalText" contenteditable="true"
         onfocus="clearPlaceholder()" onblur="restorePlaceholder()"></div>
    <p class="modal-hint">Você pode escrever aqui diretamente. Para deixar o texto permanente no arquivo, envie o conteúdo final.</p>
  </div>
</div>

<script>
const PROFILES = {"conecta": {"name": "Hello Conecta", "sector": "Escolas", "mono": "CO", "color": "#E8A93B", "text": "O Hello Conecta é a plataforma de gestão e comunicação criada para conectar escolas, professores e famílias em um só lugar. Centraliza boletins, comunicados, controle de frequência, pagamentos e canais de mensagens, reduzindo a burocracia do dia a dia escolar e aproximando a gestão pedagógica dos responsáveis. Pensado para redes de ensino, escolas particulares e instituições de todos os portes, o Hello Conecta transforma a comunicação escolar em uma experiência simples, rápida e transparente."}, "saude": {"name": "Hello Saúde", "sector": "Hospitais", "mono": "SA", "color": "#2E9E83", "text": "O Hello Saúde é a solução de gestão hospitalar que integra prontuário eletrônico, agendamento, faturamento e fluxo de atendimento em uma única plataforma. Desenvolvido para hospitais, clínicas de médio e grande porte e redes de saúde, o produto reduz o tempo de espera, melhora a segurança dos dados clínicos e dá visibilidade completa da operação para gestores e equipes assistenciais. Mais eficiência para quem cuida, mais cuidado para quem é atendido."}, "odonto": {"name": "Hello Odonto", "sector": "Odontologia", "mono": "OD", "color": "#3F8FC4", "text": "O Hello Odonto é o sistema de gestão feito sob medida para clínicas e consultórios odontológicos. Reúne agenda inteligente, prontuário digital, orçamentos, controle financeiro e lembretes automáticos de consulta, ajudando dentistas e equipes administrativas a reduzir faltas, otimizar a cadeira clínica e oferecer uma experiência mais próxima ao paciente. Ideal para clínicas independentes e redes odontológicas que buscam crescer com organização."}, "market": {"name": "Hello Market", "sector": "Mercados", "mono": "MK", "color": "#D9622B", "text": "O Hello Market é a plataforma de PDV e ERP para supermercados, mercearias e redes de varejo alimentar. Une frente de caixa, controle de estoque, precificação, fiscal e relatórios gerenciais em um sistema único, feito para acompanhar o ritmo do comércio de mercados. Com o Hello Market, donos e gestores ganham controle total da operação, do balcão ao financeiro, com dados em tempo real para decidir melhor."}, "pet": {"name": "Hello Pet", "sector": "Petshops", "mono": "PE", "color": "#6FA13B", "text": "O Hello Pet é o sistema de gestão para petshops, clínicas veterinárias e centros de estética animal. Organiza agendamentos de banho e tosa, prontuário veterinário, controle de estoque de produtos e vendas em um só painel, facilitando a rotina de quem cuida da saúde e do bem-estar dos pets. Feito para negócios que querem crescer sem perder o cuidado artesanal no atendimento a cada tutor e seu animal."}, "farma": {"name": "Hello Farma", "sector": "Farmácias", "mono": "FA", "color": "#C0455C", "text": "O Hello Farma é a solução de gestão para farmácias e drogarias, unindo PDV, controle de estoque, validade de medicamentos, fidelização de clientes e integração fiscal em uma plataforma completa. Criado para farmácias independentes e redes, o produto ajuda a reduzir perdas, agilizar o atendimento no balcão e manter a farmácia em conformidade com as exigências regulatórias do setor."}, "fit": {"name": "Hello Fit", "sector": "Academias", "mono": "FI", "color": "#E0A013", "text": "O Hello Fit é a plataforma de gestão para academias, estúdios de treino e centros de bem-estar. Administra matrículas, planos, controle de acesso, agenda de aulas e cobrança recorrente em um único lugar, simplificando a rotina de gestores e instrutores. Com o Hello Fit, o negócio foca no que importa: manter alunos engajados, motivados e fiéis ao seu espaço de treino."}, "beauty": {"name": "Hello Beauty", "sector": "Estética", "mono": "BE", "color": "#B3467C", "text": "O Hello Beauty é o sistema de gestão para salões de beleza, clínicas de estética e espaços de bem-estar. Reúne agenda online, comissionamento de profissionais, controle de estoque de produtos e histórico de atendimento por cliente, tornando a rotina do salão mais organizada e o atendimento mais personalizado. Ideal para negócios que vivem de relacionamento e querem escalar sem perder o toque humano."}, "jur": {"name": "Hello Jur", "sector": "Advocacia", "mono": "JU", "color": "#4B4E9E", "text": "O Hello Jur é a plataforma de gestão jurídica para escritórios de advocacia de todos os portes. Centraliza controle de processos, prazos, honorários, documentos e comunicação com clientes, ajudando advogados a ganhar tempo, reduzir riscos de perda de prazo e ter uma visão clara da saúde financeira do escritório. Gestão jurídica descomplicada, para focar no que realmente importa: o cliente e a causa."}, "hotel": {"name": "Hello Hotel", "sector": "Hotelaria", "mono": "HO", "color": "#2D6E8E", "text": "O Hello Hotel é o sistema de gestão para hotéis, pousadas e meios de hospedagem. Integra reservas, check-in e check-out, governança, faturamento e canais de venda em uma única plataforma, dando mais controle da operação e mais tempo para a equipe se dedicar à experiência do hóspede. Feito para negócios de hospedagem de todos os tamanhos que querem crescer com eficiência e hospitalidade."}};
const PLACEHOLDER = "Perfil ainda não adicionado. Clique aqui e cole ou digite o texto da empresa.";
let currentKey = null;

function openProfile(key) {
  currentKey = key;
  const p = PROFILES[key];
  const monoEl = document.getElementById('modalMono');
  monoEl.textContent = p.mono;
  monoEl.style.background = p.color;
  document.getElementById('modalTitle').textContent = p.name;
  document.getElementById('modalSector').textContent = p.sector;
  const textEl = document.getElementById('modalText');
  if (p.text && p.text.trim().length > 0) {
    textEl.textContent = p.text;
    textEl.classList.remove('empty');
  } else {
    textEl.textContent = PLACEHOLDER;
    textEl.classList.add('empty');
  }
  document.getElementById('overlay').classList.add('active');
}

function closeProfile() {
  if (currentKey) {
    const textEl = document.getElementById('modalText');
    if (!textEl.classList.contains('empty')) {
      PROFILES[currentKey].text = textEl.textContent.trim();
    }
  }
  document.getElementById('overlay').classList.remove('active');
  currentKey = null;
}

function clearPlaceholder() {
  const textEl = document.getElementById('modalText');
  if (textEl.classList.contains('empty')) {
    textEl.textContent = '';
    textEl.classList.remove('empty');
  }
}

function restorePlaceholder() {
  const textEl = document.getElementById('modalText');
  if (textEl.textContent.trim().length === 0) {
    textEl.textContent = PLACEHOLDER;
    textEl.classList.add('empty');
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeProfile();
});

function toggleTheme() {
  document.documentElement.classList.toggle('dark');
}

if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.classList.add('dark');
}
</script>

</body>
</html>
